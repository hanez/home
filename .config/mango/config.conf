# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.85
blur_params_contrast = 0.95
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 4
shadows_blur = 8
shadows_position_x = -3
shadows_position_y = -3
shadows_color=0x000000aa

# rounded corners
border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=0
layer_animations=0
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.5
animation_duration_move=350
animation_duration_open=350
animation_duration_tag=0
animation_duration_close=350
animation_duration_focus=350
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_close=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=1
scroller_prefer_center=0
# this seems to have no effect, check (https://mangowm.github.io/docs/window-management/layouts#configuration):
scroller_prefer_overspread=1
edge_scroller_pointer_focus=0
scroller_default_proportion_single=0.8
scroller_proportion_preset=0.5,0.7,0.9

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.50
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=30
enable_hotarea=0
#overview_tab_mode=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=10
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=0

# keyboard
repeat_rate=35
repeat_delay=240
numlock_on=0
xkb_rules_layout=de
xkb_rules_options=caps:escape_shifted_capslock

# mouse
mouse_accel_profile=2
mouse_accel_speed=5.0
mouse_natural_scrolling=0
#left_handed=0
axis_scroll_factor=1.0

# mouse cursor
cursor_size=32
cursor_theme=Adwaita

# Trackpad
# need relogin to make it apply
disable_trackpad=0
#tap_to_click=1
#tap_and_drag=1
#drag_lock=1
#trackpad_natural_scrolling=0
#disable_while_typing=1
#left_handed=0
#middle_button_emulation=0
#swipe_min_threshold=1

# Appearance
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x2E3440ff
border_color=0x4C566Aff
drop_color=0x4C566A55
split_color=0xBF616Aff
focus_color=0x5E81ACff
maximized_screen_color=0xA3BE8Cff
urgent_color=0xBF616Aff
scratchpad_color=0x81A1C1ff
global_color=0xB48EADff
overlay_color=0x8FBCBBff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# key bindings
# key names refer to `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=ALT+SHIFT,r,reload_config

#toggle fullscreen
bind=ALT+SHIFT,f,togglefullscreen

# commands key bindings
bind=Alt,space,spawn,wofi --conf ~/.config/mango/wofi/config --show drun
#bind=Alt,space,spawn,wofi --conf ~/.config/mango/wofi/config --show drun
bind=ALT+SHIFT,d,spawn,wofi --conf ~/.config/mango/wofi/config --show drun
bind=ALT+CTRL,l,spawn,swaylock
bind=ALT+CTRL,Up,spawn,xbacklight -steps 1 -inc 10
bind=ALT+CTRL,Down,spawn,xbacklight -steps 1 -dec 10
bind=ALT+CTRL,Left,spawn,~/.config/mango/scripts/vol -10
bind=ALT+CTRL,Right,spawn,~/.config/mango/scripts/vol +10
bind=ALT+SHIFT,s,spawn,~/.config/mango/scripts/screenshot-region
bind=ALT+CTRL,s,spawn,~/.config/mango/scripts/screenshot-full
bind=ALT+SHIFT,n,spawn,~/.config/mango/scripts/mango-move-with next
bind=ALT+SHIFT,p,spawn,~/.config/mango/scripts/mango-move-with prev

# focus
bind=Alt,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=Alt,j,focusstack,next
bind=Alt,k,focusstack,prev

# focus (arrow-keys)
bind=Alt,Left,focusdir,left
bind=Alt,Right,focusdir,right
bind=Alt,Up,focusdir,up
bind=Alt,Down,focusdir,down

# layout cycling
bind=Alt,comma,spawn_shell,~/.config/mango/scripts/cycle-layout prev
bind=Alt,period,spawn_shell,~/.config/mango/scripts/cycle-layout next

# gaps
bind=ALT+CTRL,j,incgaps,-10
bind=ALT+CTRL,k,incgaps,10

# master area
bind=Alt,u,incnmaster,+1
bind=Alt,i,incnmaster,-1
bind=Alt,h,setmfact,-0.05
bind=Alt,l,setmfact,+0.05

# window resize (floating windows)
bind=ALT+SHIFT,h,resizewin,-50,0
bind=ALT+SHIFT,l,resizewin,+50,0

# move window in stack
bind=ALT+SHIFT,j,exchange_stack_client,next
bind=ALT+SHIFT,k,exchange_stack_client,prev

# kill client
bind=Alt,x,killclient
bind=ALT+SHIFT,x,killclient

# quit
bind=ALT+SHIFT,q,quit
bind=ALT+CTRL,BackSpace,quit

# toggle floating
bind=ALT+SHIFT,space,togglefloating

# scratchpad
#bind=Alt,grave,toggle_scratchpad

# tag switching
bind=Alt,p,viewtoleft
bind=Alt,n,viewtoright

# tag moving
bind=ALT+SHIFT,Left,tagtoleft
bind=ALT+SHIFT,Right,tagtoright

# tag view
bind=Alt,1,view,1,0
bind=Alt,2,view,2,0
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0

# tag: move client to tag and follow
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# view all tags
bind=Alt,0,view,0

# monitor focus
bind=ALT+SHIFT,comma,tagmon,left
bind=ALT+SHIFT,period,tagmon,right

# cycle monitor focus (Alt+- cycles through physical outputs)
bind=Alt,code:61,spawn_shell,~/.config/mango/scripts/cycle-monitor
# cycle monitor with focused window (Alt+Shift+- moves window to next monitor and follows)
bind=ALT+SHIFT,code:61,spawn_shell,~/.config/mango/scripts/cycle-monitor-with-client

# terminal
#bind=Alt,Return,spawn,foot zsh
bind=SUPER,Return,spawn,uxterm -bg black -fg grey -sb -leftbar -si -bc -cr orange -fa "Noto Sans Mono"i -fs 14 
bind=SUPER,a,spawn,/home/hanez/cargo/bin/zoha

# toggle overview (to select window with mouse)
bind=Alt+SHIFT,o,toggleoverview

# Mouse Button Bindings (DWM-style: Mod+Button1 = move, Mod+Button3 = resize)
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

# Axis Bindings (scroll on desktop = switch tag)
#axisbind=ALT,UP,viewtoleft
#axisbind=ALT,DOWN,viewtoright
#axisbind=ALT,UP,viewtoleft
#axisbind=ALT,DOWN,viewtoright
axisbind=ALT,UP,viewtoleft_have_client
axisbind=ALT,DOWN,viewtoright_have_client

